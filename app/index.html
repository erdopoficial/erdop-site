<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>ERDOP Central</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
:root{color-scheme:light;--bg:#ffffff;--fg:#111111;--muted:#6b6b6b;--accent:#cc0000;--chip:#f4f4f4}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Inter','Helvetica Neue',Arial,sans-serif;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#app{height:100%}
.ind{position:relative;height:100%;overflow-y:auto;background:#000;color:#E8E8E8;overflow:hidden;isolation:isolate;font-family:'Barlow Condensed','Inter',Arial,sans-serif}
.ind::before{content:"";position:absolute;inset:-50%;z-index:-1;background:radial-gradient(60% 40% at 50% 38%,rgba(204,0,0,.35),transparent 70%),radial-gradient(120% 80% at 50% 120%,rgba(204,0,0,.25),transparent 60%),repeating-linear-gradient(115deg,#070707 0 14px,#0d0d0d 14px 15px);animation:indbreath 5s ease-in-out infinite}
.ind-embers{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.ind-grid{position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(rgba(232,232,232,.04) 1px,transparent 1px) 0 0/100% 32px,linear-gradient(90deg,rgba(232,232,232,.04) 1px,transparent 1px) 0 0/32px 100%;mask-image:radial-gradient(70% 60% at 50% 40%,#000,transparent)}
.ind-scan{position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.ind-scan::after{content:"";position:absolute;left:0;right:0;height:22%;background:linear-gradient(180deg,transparent,rgba(204,0,0,.08),transparent);animation:indsweep 6s linear infinite}
.ind-inner{position:relative;z-index:2;max-width:440px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:20px 24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.ind-top,.ind-foot{display:flex;justify-content:space-between;gap:12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.2em;color:#888888}
.ind-foot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(232,232,232,.12)}
.ind-live{color:#CC0000;display:inline-flex;align-items:center;gap:6px}
.ind-live::before{content:"";width:6px;height:6px;background:#CC0000;box-shadow:0 0 10px #CC0000;animation:indblink 1.2s steps(2) infinite}
.ind-logo{position:relative;width:min(88%,360px);margin:28px auto 0;aspect-ratio:512/296;filter:drop-shadow(0 0 18px rgba(204,0,0,.55)) drop-shadow(0 12px 30px rgba(0,0,0,.9))}
.ind-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;max-width:none}
.ind-logo .l-base{animation:indshake 4.2s infinite}
.ind-logo .l-r{filter:brightness(0) saturate(100%) invert(14%) sepia(98%) saturate(7400%) hue-rotate(358deg);mix-blend-mode:screen;opacity:.85;animation:indglitchA 3.1s infinite steps(1)}
.ind-logo .l-c{filter:brightness(0) invert(1);mix-blend-mode:screen;opacity:.5;animation:indglitchB 3.1s infinite steps(1)}
.ind-flare{position:absolute;inset:-10% -20%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);mix-blend-mode:overlay;animation:indflare 4.5s ease-in-out infinite;pointer-events:none;mask-image:url(./media/logo.png);mask-size:contain;mask-repeat:no-repeat;mask-position:center;-webkit-mask-image:url(./media/logo.png);-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center}
.ind-sub{margin:0;text-align:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#888888}
.ind-card{margin-top:10px;display:flex;flex-direction:column;gap:14px}
.ind-card h1{margin:0;font-family:'Anton','Impact',sans-serif;font-weight:400;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.01em;color:#E8E8E8;text-shadow:2px 0 0 rgba(204,0,0,.8),-1px 0 0 rgba(232,232,232,.25);text-wrap:balance}
.ind-card p{margin:0;color:#b5b5b5;line-height:1.5;font-family:'Inter',Arial,sans-serif;font-size:14px}
.ind-list{display:flex;flex-direction:column;gap:10px}
.ind-btn{position:relative;display:flex!important;align-items:center;justify-content:flex-start!important;gap:14px;min-height:64px;padding:0 16px;border:1px solid #2a2a2a;background:linear-gradient(180deg,#151515,#0a0a0a);color:#E8E8E8;cursor:pointer;text-align:left;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -2px 0 rgba(0,0,0,.6);transition:border-color .15s,background .15s,transform .1s}
.ind-btn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#CC0000;box-shadow:0 0 14px #CC0000;opacity:.5;transition:opacity .15s}
.ind-btn:hover,.ind-btn:focus-visible{border-color:#CC0000;background:linear-gradient(180deg,#220707,#0a0a0a)}
.ind-btn:hover::before,.ind-btn:focus-visible::before{opacity:1}
.ind-btn:focus-visible{outline:2px solid #CC0000;outline-offset:3px}
.ind-n{font-family:'JetBrains Mono',monospace;font-size:12px;color:#CC0000;letter-spacing:.1em}
.ind-who{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.ind-who b{font-family:'Anton','Impact',sans-serif;font-weight:400;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.ind-who small{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#888888}
.ind-arrow{font-size:20px;color:#888888;transition:transform .15s,color .15s}
.ind-btn:hover .ind-arrow{transform:translateX(4px);color:#CC0000}
.ind-note{font-size:12px!important;color:#888888!important;font-family:'JetBrains Mono',monospace!important;letter-spacing:.04em}
.ind-load{margin-top:22px;display:flex;flex-direction:column;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#888888}
.ind-bar{height:3px;background:#1a1a1a;position:relative;overflow:hidden}
.ind-bar::after{content:"";position:absolute;inset:0;width:40%;background:#CC0000;box-shadow:0 0 12px #CC0000;animation:indload 1.1s ease-in-out infinite}
@keyframes indbreath{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes indsweep{from{top:-25%}to{top:105%}}
@keyframes indblink{50%{opacity:.2}}
@keyframes indload{from{left:-40%}to{left:100%}}
@keyframes indflare{0%,55%{transform:translateX(-60%)}80%,100%{transform:translateX(60%)}}
@keyframes indshake{0%,90%,100%{transform:none}91%{transform:translate(-3px,1px) skewX(-6deg)}93%{transform:translate(4px,-1px)}95%{transform:translate(-1px,2px) skewX(4deg)}}
@keyframes indglitchA{0%,100%{transform:translate(-3px,0);clip-path:inset(0 0 0 0)}88%{transform:translate(-8px,2px);clip-path:inset(12% 0 60% 0)}90%{transform:translate(9px,-1px);clip-path:inset(55% 0 20% 0)}92%{transform:translate(-4px,0);clip-path:inset(30% 0 45% 0)}94%{transform:translate(-3px,0);clip-path:inset(0 0 0 0)}}
@keyframes indglitchB{0%,100%{transform:translate(2px,0);opacity:0}89%{transform:translate(10px,-2px);clip-path:inset(40% 0 35% 0);opacity:.7}91%{transform:translate(-9px,1px);clip-path:inset(70% 0 5% 0);opacity:.6}93%{opacity:0}}
@media (prefers-reduced-motion: reduce){.ind *,.ind::before,.ind *::before,.ind *::after{animation:none!important}}


*{box-sizing:border-box}
button,input,textarea{font-family:inherit}
button{transition:background-color .2s ease,color .2s ease,transform .12s ease}
button:active{transform:scale(.97)}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #cc0000;outline-offset:2px}
input::placeholder,textarea::placeholder{color:#8a8a8a;opacity:1}
.sx{scrollbar-width:none}.sx::-webkit-scrollbar{display:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 10px 26px rgba(204,0,0,0.08)}50%{box-shadow:0 10px 36px rgba(204,0,0,0.08)}}
.rise{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.sheet{animation:sheet .3s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .2s ease both}
.pop{animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
.glow{animation:glow 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.rise,.sheet,.fade,.pop,.glow{animation:none !important}}

.ind-err{color:#ff6b6b!important;font-family:'JetBrains Mono',monospace!important;font-size:12px!important}
.ind-ok{color:#7dd3a0!important;font-family:'JetBrains Mono',monospace!important;font-size:12px!important}
.ind-or{display:flex;align-items:center;gap:12px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#888888}
.ind-or::before,.ind-or::after{content:"";flex:1;height:1px;background:rgba(232,232,232,.14)}
.ind-form{display:flex;flex-direction:column;gap:8px}
.ind-form label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#888888;margin-top:4px}
.ind-form input{min-height:50px;padding:0 14px;background:#0b0b0b;border:1px solid #2a2a2a;color:#E8E8E8;font-size:16px;font-family:'Inter',Arial,sans-serif;border-radius:0;outline:none}
.ind-form input:focus{border-color:#CC0000;box-shadow:0 0 0 1px #CC0000,0 0 18px rgba(204,0,0,.35)}
.ind-submit{margin-top:8px;min-height:54px;border:0;background:#CC0000;color:#fff;font-family:'Anton','Impact',sans-serif;font-size:19px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));box-shadow:0 0 24px rgba(204,0,0,.45)}
.ind-submit:hover{background:#e00000}
.ind-submit:disabled{opacity:.6;cursor:wait}
.ind-submit:focus-visible{outline:2px solid #fff;outline-offset:3px}
.ind-links{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px}
.ind-links button{background:none;border:0;padding:6px 0;min-height:36px;color:#b5b5b5;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.ind-links button:hover{color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-tpl"><div style="width: 100%; max-width: 480px; margin: 0 auto; height: 100%; position: relative; background: #ffffff; color: #111111; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; display: flex; flex-direction: column; overflow: hidden;">

  <header style="padding: 14px 20px 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
      <span style="font-size: 24px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.1;">{{pageTitle}}</span>
      <button type="button" onClick="{{goPay}}" style="display: flex; align-items: center; justify-content: flex-start; align-self: flex-start; min-height: 32px; padding: 0 12px; border-radius: 16px; background: #f4f4f4; color: #6b6b6b; border: 0; font-size: 12px; cursor: pointer; gap: 6px;"><span style="width: 7px; height: 7px; border-radius: 4px; background: #138a4b;"></span>Seu Pix 15/12 · <b style="color: #111111; font-weight: 700;">{{me.total}}</b></button>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <sc-if value="{{tProducao}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{addIdea}}" aria-label="Nova ideia" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: #cc0000; color: #ffffff; border: 0; font-size: 24px; cursor: pointer;">+</button>
      </sc-if>
      <button type="button" onClick="{{goBanda}}" aria-label="Banda: membros, acordo e jurídico" style="width: 44px; height: 44px; border-radius: 22px; background: {{avBg}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: {{avC}}; border: 0; cursor: pointer;">{{meIni}}</button>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 6px 20px 24px; display: flex; flex-direction: column; gap: 16px;">

    <!-- ================= INÍCIO ================= -->
    <sc-if value="{{tInicio}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <sc-if value="{{hasPend}}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{openApprove}}" style="border: 0; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; justify-content: flex-start; gap: 12px; text-align: left; color: #ffffff; cursor: pointer; background: #000000;">
            <div style="display: flex; flex: none; padding-right: 10px;">
              <sc-for list="{{pendThumbs}}" as="pt" hint-placeholder-count="3">
                <img src="{{pt.src}}" alt="" style="width: 34px; height: 44px; object-fit: cover; border-radius: 8px; border: 2px solid rgba(255,255,255,0.9); margin-right: -10px; background: #e8e8e8;">
              </sc-for>
            </div>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;"><span style="font-size: 17px; font-weight: 700;">{{headline}}</span><span style="font-size: 13px; opacity: 0.9;">Toque para aprovar · fecha qua 21h</span></span>
            <span aria-hidden="true" style="font-size: 26px; line-height: 1;">›</span>
          </button>
        </sc-if>

        <section aria-label="Score do @erdop.oficial" style="background: #f4f4f4; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
            <div style="display: flex; align-items: baseline; gap: 8px;"><span style="font-size: 34px; font-weight: 600; letter-spacing: -0.03em; line-height: 1;">141</span><span style="font-size: 13px; color: #6b6b6b;">seguidores · @erdop.oficial</span></div>
            <span style="font-size: 13px; font-weight: 700; color: #cc0000;">66%</span>
          </div>
          <div style="height: 6px; border-radius: 3px; background: #e8e8e8; overflow: hidden;"><div style="width: 66%; height: 6px; border-radius: 3px; background: #cc0000;"></div></div>
          <span style="font-size: 12px; color: #6b6b6b;">Meta: 212 até fevereiro · alcance de 3.388 contas em 28 dias</span>
          <div role="img" aria-label="Alcance diário quase zero até 29/10 e pico de 1.406 depois do post de 30/10" style="height: 56px; display: flex; align-items: flex-end; gap: 3px;">
            <sc-for list="{{reachBars}}" as="rb" hint-placeholder-count="28">
              <div style="flex: 1; height: {{rb.h}}; border-radius: 3px 3px 1px 1px; background: {{rb.c}};"></div>
            </sc-for>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 11px; color: #8a8a8a;"><span>06/10</span><span style="color: #cc0000;">pico 1.406 após o post de 30/10</span><span>02/11</span></div>
        </section>

        <div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-size: 17px; font-weight: 700;">Próximos dias</span><button type="button" onClick="{{goAgenda}}" style="display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 4px; background: none; border: 0; color: #cc0000; font-size: 14px; font-weight: 600; cursor: pointer;">Ver agenda ›</button></div>
        <div style="background: #f4f4f4; border-radius: 18px; padding: 4px 8px;">
          <sc-for list="{{nextEvents}}" as="ne" hint-placeholder-count="3">
            <button type="button" onClick="{{ne.go}}" style="width: 100%; background: none; border: 0; color: #111111; text-align: left; display: flex; justify-content: flex-start; align-items: center; gap: 12px; padding: 10px 6px; cursor: pointer; border-bottom: 1px solid #e8e8e8;">
              <div style="width: 46px; flex: none; display: flex; flex-direction: column; align-items: center; border-radius: 12px; background: {{ne.tint}}; padding: 5px 0;"><span style="font-size: 10px; color: {{ne.c}}; font-weight: 700; text-transform: uppercase;">{{ne.wd}}</span><span style="font-size: 17px; font-weight: 700; line-height: 1.1;">{{ne.day}}</span></div>
              <span style="flex: 1; display: flex; flex-direction: column; min-width: 0;"><span style="font-size: 15px; font-weight: 600;">{{ne.t}}</span><span style="font-size: 12px; color: #6b6b6b;">{{ne.time}} · {{ne.kind}}</span></span>
              <span aria-hidden="true" style="color: #8a8a8a; font-size: 20px;">›</span>
            </button>
          </sc-for>
        </div>

        <button type="button" onClick="{{openExp}}" style="display: flex; align-items: center; justify-content: flex-start; background: #f4f4f4; border: 0; border-radius: 18px; padding: 14px 16px; gap: 12px; text-align: left; color: #111111; cursor: pointer; min-height: 72px;">
          <span style="width: 42px; height: 42px; border-radius: 14px; background: rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center; flex: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 700;">Pagou algo pela banda?</span><span style="font-size: 13px; color: #6b6b6b;">Lance o gasto em segundos</span></span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; font-size: 11px; color: #6b6b6b;">caixa<b style="color: #555555; font-size: 14px;">{{caixaTxt}}</b></span>
        </button>

        <span style="font-size: 17px; font-weight: 700;">Suas tarefas</span>
        <div style="background: #f4f4f4; border-radius: 18px; padding: 4px 8px;">
          <sc-for list="{{myTasks}}" as="mt" hint-placeholder-count="3">
            <button type="button" onClick="{{mt.go}}" style="width: 100%; min-height: 52px; background: none; border: 0; color: #111111; text-align: left; display: flex; justify-content: flex-start; align-items: center; gap: 12px; padding: 8px 6px; cursor: pointer; border-bottom: 1px solid #e8e8e8;">
              <span style="width: 10px; height: 10px; border-radius: 5px; background: {{mt.c}}; flex: none;"></span>
              <span style="flex: 1; font-size: 14px; color: {{mt.tc}};">{{mt.t}}</span>
              <span style="font-size: 12px; color: {{mt.c}}; white-space: nowrap;">{{mt.st}}</span>
            </button>
          </sc-for>
        </div>
        <button type="button" onClick="{{goBanda}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-radius: 18px; background: #f4f4f4; color: #111111; border: 0; font-size: 14px; cursor: pointer;"><span style="display: flex; flex-direction: column; align-items: flex-start;"><b style="font-weight: 600;">Banda</b><span style="font-size: 12px; color: #6b6b6b;">membros, acordo e jurídico</span></span><span aria-hidden="true" style="color: #8a8a8a; font-size: 20px;">›</span></button>
      </div>
    </sc-if>

    <!-- ================= AGENDA ================= -->
    <sc-if value="{{tAgenda}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <sc-if value="{{toastOn}}" hint-placeholder-val="{{ false }}">
          <div class="pop" style="display: flex; align-items: center; gap: 10px; background: #111111; color: #ffffff; border-radius: 14px; padding: 12px 14px;">
            <span style="flex: 1; font-size: 13px; line-height: 1.4;">{{toastTxt}}</span>
            <button type="button" onClick="{{closeToast}}" aria-label="Fechar aviso" style="width: 32px; height: 32px; border-radius: 16px; background: rgba(255,255,255,0.14); color: #ffffff; border: 0; cursor: pointer;">✕</button>
          </div>
        </sc-if>
        <div style="display: flex; gap: 8px;">
          <button type="button" onClick="{{openShowFlow}}" style="flex: 1.3; min-height: 52px; border-radius: 16px; background: #cc0000; color: #ffffff; border: 0; font-size: 15px; font-weight: 700; cursor: pointer;">Marcar show</button>
          <button type="button" onClick="{{openEvent}}" style="flex: 1; min-height: 52px; border-radius: 16px; background: #f4f4f4; color: #111111; border: 0; font-size: 14px; font-weight: 600; cursor: pointer;">+ Ensaio ou outro</button>
        </div>
        <section aria-label="Calendário" style="background: #f4f4f4; border-radius: 18px; padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px;">
            <button type="button" onClick="{{prevMonth}}" aria-label="Mês anterior" style="{{prevStyle}}">‹</button>
            <span style="font-size: 17px; font-weight: 700;">{{monthLabel}}</span>
            <button type="button" onClick="{{nextMonth}}" aria-label="Próximo mês" style="{{nextStyle}}">›</button>
          </div>
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px;">
            <sc-for list="{{weekHead}}" as="wh" hint-placeholder-count="7"><span style="text-align: center; font-size: 11px; font-weight: 700; color: #8a8a8a; padding: 2px 0;">{{wh}}</span></sc-for>
            <sc-for list="{{cells}}" as="ce" hint-placeholder-count="35">
